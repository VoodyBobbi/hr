# Локальный запуск (не Render, не облако). В Docker-режиме данные (анкеты,
# история переписки, логи) лежат в папке ./hr-data на этом компьютере — рядом
# с docker-compose.yml (задаётся явно переменной HR_DATA_DIR=/data ниже +
# volume). Вне Docker (обычный python run_all.py) данные по умолчанию лежат
# в HR/ внутри самой папки проекта — оба варианта одинаково НЕ попадают в git
# (см. .gitignore), просто это две разные папки на диске. Замените "./hr-data"
# на любой другой путь на диске администратора, если нужно хранить Docker-данные
# не рядом с кодом, а в отдельном месте — например "/home/admin/hr-data" или
# "C:/HR-Data" на Windows (Docker Desktop понимает такие пути).
#
# Почему ОДИН контейнер, а не несколько (сайт отдельно, бот отдельно, база
# данных отдельно) — этот вопрос обычно возникает при чтении docker-compose:
# 1. Нет отдельной СУБД (Postgres/MySQL/Redis) — все данные хранятся в
#    обычных файлах (CSV/JSON) через backend/paths.py, поэтому нет и
#    отдельного сервиса базы данных, который был бы кандидатом на свой
#    контейнер.
# 2. Сайт (backend/app.py) и Telegram-бот (backend/telegram_bot.py) — это
#    два ПРОЦЕССА ОДНОГО И ТОГО ЖЕ кода, оба читают один backend/data и
#    пишут в один HR_DATA_DIR. Разнести их по разным контейнерам означало бы
#    городить общий volume и сеть между двумя контейнерами ради двух
#    процессов, которые и так спокойно живут внутри одного (см. start.sh —
#    бот поднимается в фоне через &, сайт — основным процессом).
# 3. Нагрузка этого проекта (консультации кандидатов) не требует отдельного
#    горизонтального масштабирования сайта и бота по отдельности — значит и
#    причины разносить их ради независимого масштабирования тоже нет.
# Если проект вырастет настолько, что появится смысл в отдельной СУБД или в
# раздельном масштабировании сайта/бота — тогда и будет повод пересмотреть
# эту схему, а не заранее.
services:
  hr-assistant:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HR_DATA_DIR=/data
    volumes:
      - ./hr-data:/data
    restart: unless-stopped
